name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Collect artifact
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*plain*' | head -n 1)
          test -n "$JAR" || { echo "실행 가능한 JAR 을 찾지 못했습니다"; exit 1; }
          mkdir -p dist && cp "$JAR" dist/backend.jar
          ls -l dist/

      - name: Upload JAR to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "dist/backend.jar"
          target: "/opt/backend/incoming/"
          strip_components: 1

      - name: Swap, restart, verify (rollback on failure)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -euo pipefail
            APP=/opt/backend
            NEW=$APP/incoming/backend.jar
            CUR=$APP/backend.jar
            PREV=$APP/backend.jar.prev

            test -s "$NEW" || { echo "업로드된 JAR 이 비어 있습니다"; exit 1; }

            [ -f "$CUR" ] && cp -f "$CUR" "$PREV"
            mv -f "$NEW" "$CUR"

            sudo systemctl restart backend

            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "기동 확인"
                rm -f "$PREV"
                exit 0
              fi
              sleep 10
            done

            echo "헬스체크 실패 — 이전 JAR 로 롤백"
            if [ -f "$PREV" ]; then
              mv -f "$PREV" "$CUR"
              sudo systemctl restart backend
            fi
            exit 1
